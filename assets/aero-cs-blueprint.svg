<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Aeronautics and Computer Science blueprint banner</title>
  <desc id="desc">A navy technical blueprint with a fighter aircraft outline, engineering grid, measurements, and callouts for Sundaram V. Dubey.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#75b9dc" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <pattern id="microgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#75b9dc" stroke-opacity=".08" stroke-width=".7"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="#081b2b"/>
  <rect width="1600" height="520" fill="url(#microgrid)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <path d="M40 40H1560V480H40Z" fill="none" stroke="#75b9dc" stroke-opacity=".6" stroke-width="2"/>
  <path d="M40 82H1560M40 438H1560" stroke="#75b9dc" stroke-opacity=".25" stroke-width="1" stroke-dasharray="8 12"/>

  <g fill="none" stroke="#d7f3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" transform="translate(245 0)">
    <!-- top-view aircraft schematic -->
    <path d="M500 107 L532 232 L692 293 L735 315 L692 337 L532 290 L500 414 L482 414 L483 288 L358 335 L304 325 L468 258 L304 195 L358 185 L483 231 L482 107 Z"/>
    <path d="M500 107L500 414M468 258H735M358 185L468 258L358 335M532 232L468 258L532 290" stroke="#75b9dc" stroke-width="1.3"/>
    <path d="M482 152H518M475 180H525M470 208H530M470 308H530M475 336H525M482 364H518" stroke="#75b9dc" stroke-width="1"/>
    <circle cx="500" cy="258" r="15" stroke="#75b9dc" stroke-width="1"/>
    <path d="M500 231V285M473 258H527" stroke="#75b9dc" stroke-width="1"/>
  </g>

  <!-- measurement rails -->
  <g fill="none" stroke="#75b9dc" stroke-width="1.2" stroke-dasharray="5 5">
    <path d="M286 150H286M286 150V396M286 150H466M286 396H466"/>
    <path d="M272 150h28M272 396h28"/>
    <path d="M304 126H735M304 118V134M735 118V134"/>
    <path d="M820 130V390"/>
  </g>
  <g fill="#a9dfff" font-family="Courier New, Liberation Mono, monospace" font-size="14" letter-spacing="2">
    <text x="72" y="280" transform="rotate(-90 72 280)">AEROSPACE PROFILE // ORTHOGRAPHIC VIEW</text>
    <text x="485" y="113">FLIGHT VECTOR</text>
    <text x="488" y="448">SPAN / STABILITY / CONTROL</text>
  </g>

  <!-- left identity block -->
  <g fill="#d7f3ff" font-family="Courier New, Liberation Mono, monospace">
    <text x="92" y="113" font-size="17" letter-spacing="4">DESIGN NOTE 01</text>
    <text x="92" y="170" font-size="35" font-weight="700" letter-spacing="3">AERONAUTICS</text>
    <text x="92" y="208" font-size="35" font-weight="700" letter-spacing="3">× COMPUTER SCIENCE</text>
    <text x="92" y="252" font-size="16" fill="#75b9dc" letter-spacing="3">SYSTEMS • MODELS • DATA • FLIGHT</text>
    <text x="92" y="294" font-size="24" font-weight="700" letter-spacing="3">SUNDARAM V. DUBEY</text>
    <text x="92" y="326" font-size="14" fill="#75b9dc" letter-spacing="2">IIT MADRAS // AERONAUTICS &amp; SPACE TECHNOLOGY</text>
    <text x="92" y="350" font-size="14" fill="#75b9dc" letter-spacing="2">IIT MANDI // AI-DRIVEN DATA &amp; PROGRAMMING</text>
  </g>

  <!-- right callout boxes -->
  <g fill="none" stroke="#75b9dc" stroke-width="1.4">
    <rect x="940" y="100" width="260" height="92"/>
    <rect x="1225" y="100" width="260" height="92"/>
    <rect x="940" y="218" width="545" height="82"/>
    <rect x="940" y="326" width="545" height="62"/>
  </g>
  <g fill="#d7f3ff" font-family="Courier New, Liberation Mono, monospace">
    <text x="962" y="130" font-size="13" fill="#75b9dc" letter-spacing="2">PRIMARY VECTOR</text>
    <text x="962" y="163" font-size="24" font-weight="700">BUILD / LEARN</text>
    <text x="1247" y="130" font-size="13" fill="#75b9dc" letter-spacing="2">CONTROL SURFACE</text>
    <text x="1247" y="163" font-size="24" font-weight="700">CODE / ANALYZE</text>
    <text x="962" y="249" font-size="13" fill="#75b9dc" letter-spacing="2">CURRENT STACK</text>
    <text x="962" y="280" font-size="20">C  •  C++  •  PYTHON  •  NUMPY  •  PANDAS</text>
    <text x="962" y="355" font-size="13" fill="#75b9dc" letter-spacing="2">INSTRUMENTATION</text>
    <text x="962" y="378" font-size="16">MATPLOTLIB  /  SUPABASE  /  GITHUB</text>
  </g>

  <g stroke="#d7f3ff" stroke-width="2">
    <path d="M40 40h24M40 40v24M1560 40h-24M1560 40v24M40 480h24M40 480v-24M1560 480h-24M1560 480v-24"/>
  </g>
  <text x="1430" y="460" fill="#75b9dc" font-family="Courier New, Liberation Mono, monospace" font-size="13" letter-spacing="2">REV. 2026.08</text>
</svg>
